<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="436" viewBox="0 0 1200 436" role="img" aria-label="About">
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6edf3; }
  .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #8b949e; }
  .big { font-size: 46px; font-weight: 800; letter-spacing: -1px; }
  .unit { font-size: 18px; font-weight: 600; fill: #8b949e; }
  .small { font-size: 13px; }
  .dim { fill: #8b949e; }
  .strong { font-weight: 700; }
  .tile { fill: #141f29; stroke: #24323f; }
  .grad { fill: url(#accent); }
  /* Final state is the default; animations start from the hidden state so
     renderers that do not play them still show everything */
  .fade { animation: fade .8s ease-out backwards; }
  .grow { transform-box: fill-box; transform-origin: left; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) .4s backwards; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes grow { from { transform: scaleX(0); } }

  .cursor { fill: #2EC4B6; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
