IDC, account lifecycle management</text><text x="64" y="246" class="mono" style="font-size:13px;fill:#3b4b5a" text-anchor="end">6</text><text x="106" y="246" class="mono fade" style="font-size:15px;animation-delay:0.40s"><tspan fill="#ff9f6b">- </tspan><tspan fill="#7ee0d6" font-weight="700">secops</tspan><tspan fill="#8b949e">:</tspan></text><text x="215" y="246" class="mono fade" style="font-size:15px;fill:#d2dbe4;animation-delay:0.40s">incident response, sign-in auditing, mail security hardening</text><text x="64" y="276" class="mono" style="font-size:13px;fill:#3b4b5a" text-anchor="end">7</text><text x="106" y="276" class="mono fade" style="font-size:15px;animation-delay:0.48s"><tspan fill="#ff9f6b">- </tspan><tspan fill="#7ee0d6" font-weight="700">data</tspan><tspan fill="#8b949e">:</tspan></text><text x="215" y="276" class="mono fade" style="font-size:15px;fill:#d2dbe4;animation-delay:0.48s">ETL &amp; cross-system imports (SIS / ERP / LMS), reconciliation scripts</text><text x="64" y="306" class="mono" style="font-size:13px;fill:#3b4b5a" text-anchor="end">8</text><text x="106" y="306" class="mono fade" style="font-size:15px;animation-delay:0.56s"><tspan fill="#ff9f6b">- </tspan><tspan fill="#7ee0d6" font-weight="700">integ</tspan><tspan fill="#8b949e">:</tspan></text><text x="215" y="306" class="mono fade" style="font-size:15px;fill:#d2dbe4;animation-delay:0.56s">REST APIs, webhooks, workflow orchestration (iPaaS / n8n)</text><text x="64" y="336" class="mono" style="font-size:13px;fill:#3b4b5a" text-anchor="end">9</text><text x="106" y="336" class="mono fade" style="font-size:15px;animation-delay:0.64s"><tspan fill="#ff9f6b">- </tspan><tspan fill="#7ee0d6" font-weight="700">run</tspan><tspan fill="#8b949e">:</tspan></text><text x="215" y="336" class="mono fade" style="font-size:15px;fill:#d2dbe4;animation-delay:0.64s">web server operations (PHP / LAMP), monitoring, backups, internal MCP servers</text><text x="64" y="366" class="mono" style="font-size:13px;fill:#3b4b5a" text-anchor="end">10</text><text x="88" y="366" class="mono fade" style="font-size:15px;animation-delay:0.72s"><tspan fill="#7ee0d6" font-weight="700">side</tspan><tspan fill="#8b949e">:</tspan></text><text x="215" y="366" class="mono fade" style="font-size:15px;fill:#d2dbe4;animation-delay:0.72s">Proxmox homelab (LXC / VM), serverless GPU, web &amp; mobile apps</text>
